<!doctype html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Campaign Deal Graph · Admin</title>
<style>
  :root { --bg:#0A1420; --panel:#1E2B3D; --field:#0B1524; --ink:#F5F1E8; --muted:rgba(245,241,232,.62);
          --line:rgba(245,241,232,.14); --gold:#C89848; --pine:#5CB894; --clay:#E09A66; --red:#E67052; }
  * { box-sizing:border-box; }
  body { font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--ink); margin:0;
         padding:24px 16px 64px; max-width:1100px; margin-inline:auto; line-height:1.5; }
  a { color:var(--gold); }
  h1 { font-family:Georgia,serif; margin:0 0 4px; font-size:28px; }
  h2 { font-family:Georgia,serif; font-size:19px; margin:0 0 10px; }
  p.sub { color:var(--muted); margin:0 0 20px; }
  .nav { display:flex; gap:14px; flex-wrap:wrap; font:11px ui-monospace,monospace; letter-spacing:.1em; text-transform:uppercase;
         margin-bottom:18px; padding-bottom:12px; border-bottom:1px solid var(--line); }
  .nav a { text-decoration:none; }
  .nav a.dim { color:inherit; opacity:.65; }
  .layout { display:grid; grid-template-columns:260px 1fr; gap:16px; align-items:start; }
  .layout > * { min-width:0; }
  @media (max-width:820px) { .layout { grid-template-columns:1fr; } }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; min-width:0; }
  label { display:block; font-weight:600; font-size:13px; margin:10px 0 4px; }
  input, select, textarea, button { font:inherit; font-size:14px; padding:8px 10px; border-radius:8px; width:100%;
         border:1px solid rgba(245,241,232,.18); background:var(--field); color:var(--ink); }
  textarea { min-height:110px; resize:vertical; font-family:ui-monospace,monospace; font-size:12.5px; }
  button { background:var(--gold); color:var(--bg); border:0; font-weight:700; cursor:pointer; width:auto; margin-top:10px; }
  button.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  button.small { padding:4px 10px; font-size:12px; margin:0 4px 0 0; }
  button:disabled { opacity:.5; cursor:wait; }
  .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; }
  .list button.camp { display:block; width:100%; text-align:left; background:transparent; color:var(--ink);
         border:1px solid var(--line); margin:0 0 8px; font-weight:600; }
  .list button.camp.on { border-color:var(--gold); background:rgba(200,152,72,.10); }
  .list .meta { display:block; font-weight:400; font-size:12px; color:var(--muted); }
  .scroll { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:12px; }
  td code, pre { font-family:ui-monospace,monospace; font-size:12px; }
  pre { white-space:pre-wrap; word-break:break-word; margin:0; }
  .chip { display:inline-block; padding:1px 8px; border-radius:6px; font-size:11px; background:rgba(200,152,72,.16); color:#e0b452; }
  .chip.blocker { background:rgba(230,112,82,.18); color:var(--red); }
  .chip.major { background:rgba(224,154,102,.18); color:var(--clay); }
  .chip.ok { background:rgba(92,184,148,.16); color:var(--pine); }
  .muted { color:var(--muted); }
  .msg { font-size:13px; margin-top:8px; min-height:1em; }
  .msg.err { color:var(--red); }
  .hidden { display:none; }
  #runOut { margin-top:12px; padding:12px; background:#141F30; border-radius:8px; }
</style>

<div class="nav">
  <a href="/admin/command-center.html">⌂ Command Center</a>
  <a class="dim" href="/admin/agents.html">Agents</a>
  <a class="dim" href="/admin/intake-crm.html">Intake CRM</a>
</div>
<h1>Campaign deal graph</h1>
<p class="sub">One record of every deal term. Documents are checked against it; people approve every change.</p>

<div id="gate" class="card hidden"></div>

<div id="app" class="layout hidden">
  <div>
    <div class="card list">
      <h2>Campaigns</h2>
      <div id="campList" class="muted">Loading…</div>
      <div id="newCamp" class="hidden">
        <label for="newCampName">New campaign</label>
        <input id="newCampName" placeholder="Pylon × TOJ 2026–27">
        <button id="newCampBtn">Create</button>
      </div>
      <div class="msg" id="listMsg"></div>
    </div>
  </div>

  <div id="detail" class="hidden">
    <div class="card">
      <h2 id="campTitle"></h2>
      <div class="muted" id="campMeta"></div>
    </div>

    <div class="card">
      <h2>Graph versions</h2>
      <div class="scroll"><table id="versions"></table></div>
      <div class="msg" id="verMsg"></div>
    </div>

    <div class="card">
      <h2>Facts</h2>
      <div class="row">
        <div><label for="graphVersion">At version</label><select id="graphVersion"></select></div>
        <div><label for="diffFrom">Changes since</label><select id="diffFrom"></select></div>
      </div>
      <div class="scroll"><table id="facts"></table></div>
      <div class="scroll"><table id="diff" style="margin-top:12px"></table></div>
      <details style="margin-top:12px">
        <summary class="muted">Propose a change</summary>
        <label for="propSummary">Summary</label>
        <input id="propSummary" placeholder="Pylon share: 20% off the top (v11 §8(d))">
        <label for="propSet">Facts to set (JSON list)</label>
        <textarea id="propSet">[{"key":"split.pylon.event_sales","kind":"split","value":{"basis":"net_sale_price","rate":0.2,"order":"off_the_top"},"status":"agreed","source":"Pylon v11 §8(d)"}]</textarea>
        <button id="propBtn">Add to the open proposal</button>
        <div class="msg" id="propMsg"></div>
      </details>
    </div>

    <div class="card">
      <h2>Open findings</h2>
      <div class="scroll"><table id="findings"></table></div>
      <div class="msg" id="findMsg"></div>
    </div>

    <div class="card">
      <h2>Documents</h2>
      <div class="scroll"><table id="docs"></table></div>
      <details style="margin-top:12px">
        <summary class="muted">Add a document</summary>
        <div class="row">
          <div><label for="docKind">Kind</label><select id="docKind">
            <option>agreement</option><option>schedule</option><option>addendum</option><option>letter</option>
            <option>model</option><option>deck</option><option>plan</option><option>page</option><option>email</option><option>playbook</option>
          </select></div>
          <div><label for="docAudience">Audience</label><select id="docAudience">
            <option>internal</option><option>partner</option><option>counsel</option><option>family</option><option>public</option>
          </select></div>
          <div><label for="docOrigin">Origin</label><select id="docOrigin"><option>uploaded</option><option>compiled</option></select></div>
        </div>
        <label for="docTitle">Title</label><input id="docTitle" placeholder="Schedule M — Pylon event sales">
        <label for="docBody">Text</label><textarea id="docBody" placeholder="Paste the document text. No athlete or family records."></textarea>
        <button id="docBtn">Add document</button>
        <div class="msg" id="docMsg"></div>
      </details>
    </div>

    <div class="card">
      <h2>Run a campaign agent</h2>
      <div class="row">
        <div><label for="runRole">Agent</label><select id="runRole"></select></div>
        <div><label for="runDoc">Document</label><select id="runDoc"></select></div>
      </div>
      <label for="runTask">Extra instructions (optional)</label>
      <input id="runTask" placeholder="Leave blank for the agent's standard check">
      <button id="runBtn">Run</button>
      <div class="msg" id="runMsg"></div>
      <div id="runOut" class="hidden"></div>
    </div>
  </div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const state = { tenants: [], campaigns: [], current: null, overview: null };

  async function api(method, url, body) {
    const r = await fetch("/api/campaign" + url, {
      method, credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined,
    });
    let data = null;
    try { data = await r.json(); } catch (e) {}
    if (!r.ok) {
      const err = new Error((data && (data.reason || data.error)) || ("HTTP " + r.status));
      err.status = r.status;
      err.code = data && data.error;
      throw err;
    }
    return data;
  }

  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") n.className = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    }
    for (const k of kids) if (k !== null && k !== undefined) n.append(k instanceof Node ? k : String(k));
    return n;
  }
  function table(t, head, rows) {
    t.replaceChildren(el("tr", {}, ...head.map((h) => el("th", {}, h))), ...rows);
  }
  function say(id, text, isErr) {
    $(id).textContent = text || "";
    $(id).className = "msg" + (isErr ? " err" : "");
  }
  const j = (v) => JSON.stringify(v);
  const when = (t) => (t ? new Date(t).toISOString().slice(0, 16).replace("T", " ") : "");
  const canWrite = () => state.overview && ["owner", "approver", "editor"].includes(state.overview.role);
  const canDecide = () => state.overview && ["owner", "approver"].includes(state.overview.role);

  function gate(html) {
    $("gate").replaceChildren(...html);
    $("gate").classList.remove("hidden");
    $("app").classList.add("hidden");
  }

  async function boot() {
    let me;
    try {
      me = await api("GET", "/me");
    } catch (e) {
      if (e.status === 401) return gate([el("p", {}, "Sign in first. ", el("a", { href: "/app.html" }, "Sign in →"))]);
      if (e.code === "sign_in_again") return gate([el("p", {}, "Please sign in again. ", el("a", { href: "/app.html" }, "Sign in →"))]);
      if (e.status === 403) return gate([el("p", {}, "This page is for TOJ staff.")]);
      if (e.code === "campaign_db_not_configured")
        return gate([el("p", {}, "The deal graph database isn't connected yet. Set CAMPAIGN_DATABASE_URL on the server and apply migration 015.")]);
      return gate([el("p", { class: "msg err" }, e.message)]);
    }
    state.tenants = me.tenants;
    if (!me.tenants.length) {
      return gate([
        el("p", {}, "No workspace yet. Create the Trail of Joy workspace — you'll be its owner and can add members after."),
        el("button", { onclick: async (ev) => {
          ev.target.disabled = true;
          try { await api("POST", "/bootstrap", { slug: "toj", name: "Trail of Joy" }); location.reload(); }
          catch (e) { ev.target.disabled = false; ev.target.after(el("div", { class: "msg err" }, e.message)); }
        } }, "Create workspace"),
      ]);
    }
    $("app").classList.remove("hidden");
    if (me.tenants.some((t) => t.role !== "viewer")) $("newCamp").classList.remove("hidden");
    try {
      const roles = (await api("GET", "/roles")).roles;
      $("runRole").replaceChildren(...roles.map((r) => el("option", { value: r.id }, r.label + " — " + r.tagline)));
    } catch (e) {}
    await loadCampaigns();
  }

  async function loadCampaigns() {
    const { campaigns } = await api("GET", "/campaigns");
    state.campaigns = campaigns;
    if (!campaigns.length) { $("campList").textContent = "No campaigns yet."; return; }
    $("campList").replaceChildren(...campaigns.map((c) =>
      el("button", { class: "camp" + (state.current === c.id ? " on" : ""), onclick: () => open(c.id) },
        c.name,
        el("span", { class: "meta" },
          "v" + (c.latest_approved || "–") + " approved" + (c.open_version ? " · v" + c.open_version + " open" : "") +
          " · " + c.open_findings + " open findings · " + c.role))));
  }

  $("newCampBtn").addEventListener("click", async () => {
    const name = $("newCampName").value.trim();
    const t = state.tenants.find((x) => x.role !== "viewer");
    if (!name || !t) return;
    try {
      const { campaign } = await api("POST", "/campaigns", { tenant_id: t.id, name });
      $("newCampName").value = "";
      await loadCampaigns();
      open(campaign.id);
    } catch (e) { say("listMsg", e.message, true); }
  });

  async function open(id) {
    state.current = id;
    const ov = await api("GET", "/campaigns/" + id);
    state.overview = ov;
    $("detail").classList.remove("hidden");
    $("campTitle").textContent = ov.campaign.name;
    $("campMeta").textContent = "Status " + ov.campaign.status + " · your role: " + ov.role +
      " · latest approved v" + (ov.campaign.latest_approved || "–") + (ov.campaign.open_version ? " · open proposal v" + ov.campaign.open_version : "");
    renderVersions(ov);
    renderFindings(ov);
    renderDocs(ov);
    const nums = ov.versions.map((v) => v.number);
    const def = ov.campaign.latest_approved || ov.campaign.open_version;
    $("graphVersion").replaceChildren(...nums.map((n) => el("option", { value: n }, "v" + n + (n === ov.campaign.open_version ? " (open)" : ""))));
    if (def) $("graphVersion").value = def;
    $("diffFrom").replaceChildren(el("option", { value: "" }, "—"), ...nums.map((n) => el("option", { value: n }, "v" + n)));
    for (const b of document.querySelectorAll("#propBtn,#docBtn,#runBtn")) b.disabled = !canWrite();
    await renderGraph();
    loadCampaigns();
  }

  function renderVersions(ov) {
    table($("versions"), ["#", "Summary", "Proposed by", "Status", ""], ov.versions.map((v) => {
      const actions = el("td", {});
      if (!v.approved_by) {
        if (canDecide()) actions.append(el("button", { class: "small", onclick: () => decide(v.id, "approve") }, "Approve"));
        if (canWrite()) actions.append(el("button", { class: "small ghost", onclick: () => decide(v.id, "discard") }, "Discard"));
      }
      return el("tr", {},
        el("td", {}, "v" + v.number),
        el("td", {}, v.summary),
        el("td", { class: "muted" }, v.proposed_by),
        el("td", {}, v.approved_by
          ? el("span", { class: "chip ok" }, "approved " + when(v.approved_at) + " · " + v.approved_by)
          : el("span", { class: "chip" + (v.open_blockers ? " blocker" : "") }, v.open_blockers ? v.open_blockers + " blocker(s) open" : "open")),
        actions);
    }));
  }

  async function decide(vid, what) {
    say("verMsg", "");
    try {
      await api("POST", "/graph-versions/" + vid + "/" + what);
      await open(state.current);
    } catch (e) { say("verMsg", e.message, true); }
  }

  async function renderGraph() {
    const v = $("graphVersion").value;
    if (!v) { table($("facts"), ["No facts yet"], []); return; }
    const g = await api("GET", "/campaigns/" + state.current + "/graph?version=" + v);
    table($("facts"), ["Key", "Kind", "Value", "Status", "Source"], g.facts.map((f) =>
      el("tr", {}, el("td", {}, el("code", {}, f.key)), el("td", {}, f.kind), el("td", {}, el("pre", {}, j(f.value))),
        el("td", {}, f.status), el("td", { class: "muted" }, f.source || ""))));
    const from = $("diffFrom").value;
    if (from && Number(from) < Number(v)) {
      const d = await api("GET", "/campaigns/" + state.current + "/diff?from=" + from + "&to=" + v);
      table($("diff"), ["Changed since v" + from, "", "Was", "Now"], d.diff.map((x) =>
        el("tr", {}, el("td", {}, el("code", {}, x.key)), el("td", {}, x.change),
          el("td", {}, el("pre", {}, x.old_value ? j(x.old_value) + " · " + x.old_status : "—")),
          el("td", {}, el("pre", {}, x.new_value ? j(x.new_value) + " · " + x.new_status : "—")))));
    } else $("diff").replaceChildren();
  }
  $("graphVersion").addEventListener("change", renderGraph);
  $("diffFrom").addEventListener("change", renderGraph);

  $("propBtn").addEventListener("click", async () => {
    let set;
    try { set = JSON.parse($("propSet").value || "[]"); } catch (e) { return say("propMsg", "Facts must be a JSON list.", true); }
    try {
      const r = await api("POST", "/campaigns/" + state.current + "/facts", { summary: $("propSummary").value, set });
      say("propMsg", "Added to proposed version v" + r.version + ". An owner or approver approves it.");
      await open(state.current);
    } catch (e) { say("propMsg", e.message, true); }
  });

  function renderFindings(ov) {
    if (!ov.findings.length) { table($("findings"), ["Nothing open."], []); return; }
    table($("findings"), ["", "Finding", "Fix", "Raised", ""], ov.findings.map((f) => {
      const actions = el("td", {});
      if (canWrite()) {
        actions.append(el("button", { class: "small", onclick: () => resolve(f.id, "fixed") }, "Fixed"));
        if (f.severity !== "blocker" || canDecide())
          actions.append(el("button", { class: "small ghost", onclick: () => resolve(f.id, "waived") }, "Waive"));
      }
      return el("tr", {},
        el("td", {}, el("span", { class: "chip " + f.severity }, f.severity), " ", el("span", { class: "muted" }, f.kind)),
        el("td", {}, f.message, f.document_title ? el("div", { class: "muted" }, f.document_title + (f.fact_key ? " · " + f.fact_key : "")) : null),
        el("td", {}, f.fix || ""),
        el("td", { class: "muted" }, "v" + f.graph_version + " · " + f.raised_by),
        actions);
    }));
  }

  async function resolve(fid, status) {
    const note = status === "waived" ? prompt("Why waive it? (kept on the record)") : null;
    if (status === "waived" && !note) return;
    try {
      await api("POST", "/findings/" + fid + "/resolve", { status, note });
      await open(state.current);
    } catch (e) { say("findMsg", e.message, true); }
  }

  function renderDocs(ov) {
    table($("docs"), ["Title", "Kind", "Audience", "Latest", "Built on"], ov.documents.map((d) =>
      el("tr", {}, el("td", {}, d.title), el("td", {}, d.kind), el("td", {}, d.audience),
        el("td", {}, d.version_number ? "v" + d.version_number : "—"),
        el("td", { class: "muted" }, d.graph_version ? "graph v" + d.graph_version : ""))));
    $("runDoc").replaceChildren(...ov.documents.filter((d) => d.version_id).map((d) =>
      el("option", { value: d.version_id }, d.title + " (v" + d.version_number + ")")));
  }

  $("docBtn").addEventListener("click", async () => {
    try {
      await api("POST", "/campaigns/" + state.current + "/documents", {
        kind: $("docKind").value, audience: $("docAudience").value, origin: $("docOrigin").value,
        title: $("docTitle").value, body: $("docBody").value,
        graph_version: state.overview.campaign.latest_approved || null,
      });
      $("docTitle").value = ""; $("docBody").value = "";
      say("docMsg", "Added.");
      await open(state.current);
    } catch (e) { say("docMsg", e.message, true); }
  });

  $("runBtn").addEventListener("click", async () => {
    const btn = $("runBtn");
    btn.disabled = true;
    $("runOut").classList.add("hidden");
    say("runMsg", "Running… this can take a minute.");
    try {
      const { run_id } = await api("POST", "/campaigns/" + state.current + "/agents/run", {
        role: $("runRole").value, version_id: $("runDoc").value || null, task: $("runTask").value || undefined,
      });
      let run;
      for (let i = 0; i < 180; i++) {
        await new Promise((r) => setTimeout(r, 2000));
        run = await api("GET", "/agent-runs/" + run_id);
        if (run.status !== "running") break;
      }
      const head = run.status === "completed"
        ? "Saved: " + (run.committed ? run.committed.claims + " claim(s), " + run.committed.findings + " finding(s)" + (run.committed.version ? ", proposal v" + run.committed.version : "") : "nothing")
        : run.status === "waiting"
          ? "Eval didn't pass after " + run.retry_count + " tries — nothing was saved. Review the output below."
          : "Run failed: " + (run.error || run.status);
      say("runMsg", head, run.status !== "completed");
      $("runOut").replaceChildren(el("pre", {}, run.output || ""));
      $("runOut").classList.remove("hidden");
      await open(state.current);
    } catch (e) { say("runMsg", e.message, true); }
    btn.disabled = false;
  });

  boot();
})();
</script>
