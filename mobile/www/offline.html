<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOJ</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0A1420; color: #F3EEE4; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; padding-top: max(24px, env(safe-area-inset-top)); text-align: center; box-sizing: border-box; }
  .mark { width: 88px; height: 88px; border-radius: 20px; border: 1.5px solid #D4A24C; display: flex; align-items: center; justify-content: center; font: 800 30px/1 "Helvetica Neue", sans-serif; letter-spacing: .04em; color: #D4A24C; }
  h1 { font-size: 22px; margin: 6px 0 0; }
  p { margin: 0; color: #B9C2CF; max-width: 30ch; }
  button { margin-top: 10px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 14px; background: #D4A24C; color: #0A1420; font: 700 16px/1 -apple-system, sans-serif; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">TOJ</div>
  <h1>You're offline</h1>
  <p>TOJ needs the internet to open your kits and briefs. Things you shared to TOJ are saved on this phone and will be here when you're back.</p>
  <button type="button" onclick="location.href='https://tojcampaign.com/app/'">Try again</button>
</main>
</body>
</html>
