services:
  - type: web
    name: toj-csv-app
    runtime: node
    rootDir: .
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/me
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 3000
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: CAMPAIGN_DATABASE_URL
        sync: false
      - key: REPORTS_ENABLED
        value: "false"
      - key: BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      # Pylon events' QR codes: the address printed on them (a Ground Floor
      # Sports address, never TOJ's) and the help inbox on the stop page.
      - key: GFS_PAGE_BASE
        sync: false
      - key: GFS_HELP_EMAIL
        sync: false
    disk:
      name: app-data
      mountPath: /opt/render/project/src/db
      sizeGB: 1
