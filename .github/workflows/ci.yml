name: CI

on:
  push:
    branches: [main]
  pull_request:            # every PR, including PRs stacked on another branch

jobs:
  smoke:
    name: boot + route smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Smoke test (boots server, checks load-bearing routes)
        run: node scripts/smoke.js
        env:
          SESSION_SECRET: ci-smoke-secret
      - name: Staff access tests (no database needed)
        run: node --test tests/staff-access.test.js

  campaign-tests:
    name: campaign deal graph + agent scope tests (throwaway Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tojtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Deal graph gates, campaign routes, tool scoping (rebuilds the "deal" schema only)
        run: node --test tests/campaign-deal-graph.test.js tests/agent-tool-scope.test.js
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tojtest
