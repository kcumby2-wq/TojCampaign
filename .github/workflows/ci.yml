name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: boot + route smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Smoke test (boots server, checks load-bearing routes)
        run: node scripts/smoke.js
        env:
          SESSION_SECRET: ci-smoke-secret
